name: Feature request
description: Suggest a feature or improvement for ClipCraft AI
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the workflow and the outcome you need.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or feature you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timeline and editing
        - Captions
        - Voice and audio
        - AI music
        - Visual effects and repair
        - Avatar
        - Export
        - Localization
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request describes a workflow outcome rather than a specific implementation only.
          required: true
